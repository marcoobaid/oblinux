# OBLinux live session: auto-login as the unprivileged liveuser so the
# live medium boots straight to a working GNOME desktop. Calamares (added
# in a later increment) is responsible for disabling this on installed
# systems — it must not ship enabled on a real install.
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=liveuser

[security]

[xdmcp]

[chooser]

[debug]
