# Fix for a GDM + Plymouth + autologin VT race (docs/THEMING.md item 1
# investigation log has the full bisection/root-cause story).
#
# Root cause: GDM's autologin session started correctly on tty2, but
# Plymouth's own delayed shutdown later switched the active VT back to
# tty1, where GDM then (re)created and displayed its greeter -- making a
# perfectly healthy, already-running desktop session invisible.
#
# Fix: have GDM itself tell Plymouth to quit, synchronously, before GDM's
# own startup proceeds -- rather than leaving Plymouth to shut itself down
# on its own independent timing later, racing against the session that's
# by then already on screen. --retain-splash keeps the last rendered
# frame on screen (no flash-to-black) until GDM's own compositor draws
# over it, so the branded boot splash is visually unaffected.
#
# The leading "-" makes this non-fatal if plymouthd isn't running for any
# reason (e.g. Plymouth disabled/removed) -- GDM starts normally either way.
#
# Validated 11/11 consecutive VirtualBox boots with this in place.
[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
