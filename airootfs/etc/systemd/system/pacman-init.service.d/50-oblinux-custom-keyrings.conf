# Adds OBLinux's own custom pacman keyrings (chaotic-aur, oblinux_repo) to
# the live session's keyring population, alongside the stock
# pacman-init.service's own "archlinux" populate step.
#
# Needed because that service's own ExecStart only ever calls
# `pacman-key --populate archlinux` — verified against the actual unit
# file, it doesn't scan/discover every keyring under
# /usr/share/pacman/keyrings/ automatically. Without this, dropping the
# .gpg/-trusted files into the profile alone wouldn't be enough for the
# live session to actually trust them (the keys would be present on disk
# but never imported into pacman's local trust database).
#
# Multiple ExecStart= lines on a oneshot service run in sequence, so this
# appends to what the base unit already does rather than replacing it.
#
# This only covers the *live* session. The installed system masks
# pacman-init.service entirely (it's a live-only first-boot service — see
# shellprocess-final.conf), so it needs its own separate populate step,
# already added there for the same reason as the archlinux-keyring fix.
#
# See docs/PACKAGE_SIGNING.md for the full picture.
[Service]
ExecStart=/usr/bin/pacman-key --populate chaotic oblinux-repo
