<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  OBLinux default fonts (THEMING.md item 3). Global fontconfig config,
  per the ArchWiki Font configuration page — this is the file/syntax it
  documents for exactly this purpose, pulled verbatim, including the
  binding="strong" requirement: fontconfig 2.18+'s "genericfamily"
  feature (48-guessfamily.conf) takes precedence over plain/weak
  aliases for the standard serif/sans-serif/monospace names, so a weak
  alias here would silently be ignored on a current fontconfig version.

  sans-serif -> Inter: desktop UI default (also set directly via
  org.gnome.desktop.interface font-name in the gschema override, but
  this is what actually governs apps/web content that ask for generic
  "sans-serif" rather than a GNOME app reading the interface schema —
  e.g. Firefox's own default sans-serif, for "pleasant to read on
  browsers").

  monospace -> JetBrainsMono Nerd Font Mono: same reasoning as the
  gschema override's monospace-font-name — the Mono build variant so
  icon glyphs (starship, eza) stay fixed-width. serif is deliberately
  left untouched — no serif choice was scoped for this item.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
