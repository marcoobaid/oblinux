# OBLinux Calamares settings.
#
# Structure verified against Calamares' own example settings.conf and a
# real, working archiso-based Calamares config (uarchiso's
# archiso-calamares-config) rather than guessed — see docs/CALAMARES.md.
#
# Deliberately dropped from the reference sequence for this phase:
#   - luksbootkeyfile, luksopenswaphookcfg: no disk encryption support yet
#   - plymouthcfg: not needed — the OBLinux Plymouth theme is already
#     baked into /etc/plymouth/plymouthd.conf on the live squashfs, and
#     unpackfs clones that as-is; no install-time theme selection needed
#   - initcpiocfg: it edits /etc/mkinitcpio.conf via prepend/append/remove,
#     which can't express "insert the plymouth hook right after base/udev"
#     precisely (prepend puts it before base entirely, which is wrong).
#     shellprocess@before sets the target's HOOKS= line directly with sed
#     instead, for exact control over ordering. initcpio (which actually
#     runs mkinitcpio) is kept.
---
modules-search: [ local ]

instances:
- id:       before
  module:   shellprocess
  config:   shellprocess-before.conf
- id:       final
  module:   shellprocess
  config:   shellprocess-final.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@before
  - initcpio
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  - bootloader
  - shellprocess@final
  - preservefiles
  - umount
- show:
  - finished

branding: oblinux

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
