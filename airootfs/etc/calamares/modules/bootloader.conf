# Checked Calamares' own current bootloader.conf schema rather than reuse
# the reference project's version unverified — its kernel/img/fallback/
# timeout keys don't exist in the current schema (likely an older
# Calamares release). efiBootloaderId is deliberately not set here either:
# per the current schema's own comment, it falls back to branding.desc's
# bootloaderEntryName (sanitized) when unset, which is where OBLinux's
# name for this belongs instead of duplicating it here.
---

efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true

installHybridGRUB: false
