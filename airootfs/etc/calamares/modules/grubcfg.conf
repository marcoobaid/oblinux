# GRUB_DISTRIBUTOR is not set here — checked Calamares' own grubcfg.conf
# schema rather than assume, and it's a *calculated* value from the
# branding file's bootloaderEntryName, not a manual default here.
#
# GRUB_TERMINAL_OUTPUT was "console" until the OBLinux GRUB theme was
# added (airootfs/usr/share/grub/themes/oblinux/) — that alone was
# silently the reason no graphical theme could ever have rendered,
# regardless of GRUB_THEME, since gfxterm is required for any graphical
# output at all.
#
# `always_use_defaults: true` is required for the `defaults:` block
# below to be applied at all — this was missed on the first pass (an
# earlier read of main.py's source didn't surface this exact
# conditional) and confirmed as the actual bug via a real install:
# `defaults:` keys never made it into /etc/default/grub, at all, ever,
# with `always_use_defaults` unset. The module's actual logic:
#
#   always_use_defaults = ...configuration.get("always_use_defaults", False)
#   if always_use_defaults or overwrite or not os.path.exists(default_grub):
#       if "defaults" in ...configuration:
#           for key, value in ...configuration["defaults"].items():
#               grub_config_items[key] = ...
#
# With overwrite: false and the file already existing (shipped by the
# `grub` package), none of those three conditions were ever true, so
# `defaults:` was silently skipped in full every time — not a partial
# failure. GRUB_GFXMODE/GRUB_GFXPAYLOAD_LINUX only *looked* like they
# were being applied because they happen to already be Arch's own
# stock values in /etc/default/grub, unrelated to this config.
# `always_use_defaults: true` does not force a full-file overwrite on
# its own (that's still gated on `overwrite`, still false) — it only
# makes the `defaults:` dict get merged into the normal patch-mode
# update (`update_existing_config()`), which is what was actually
# wanted from the start.
---

overwrite: false

always_use_defaults: true

prefer_grub_d: false

keep_distributor: false

# Matches "quiet splash" already used on OBLinux's own live boot entries
# (syslinux/efiboot) — same branded boot experience on the installed
# system.
kernel_params: [ "quiet", "splash" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/usr/share/grub/themes/oblinux/theme.txt"
