# unpackfs clones the live filesystem's systemd enablement symlinks as-is,
# so live-only services need explicit handling here or they'd persist onto
# the installed system:
#   - pacman-init, choose-mirror: live-boot-only (choose-mirror is an
#     interactive prompt with no one to answer it on a real boot — left
#     enabled, it could hang an unattended boot)
#   - reflector: fine on the live ISO (ranks mirrors once for that boot
#     session) but not something that should block every single boot of
#     an installed system — disabled (not masked), so it stays available
#     to run manually/periodically later
# NetworkManager/graphical.target are already enabled via symlinks cloned
# from the live squashfs; listed explicitly anyway for certainty rather
# than relying on that silently continuing to be true.
---

units:
  - name: "pacman-init.service"
    action: "mask"
    mandatory: false

  - name: "choose-mirror.service"
    action: "mask"
    mandatory: false

  - name: "reflector.service"
    action: "disable"
    mandatory: false

  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true

  - name: "graphical.target"
    action: "enable"
    mandatory: false
