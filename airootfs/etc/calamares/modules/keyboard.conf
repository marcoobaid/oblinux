# Keyboard-layout live preview needs `ckbcomp` (AUR-only, like
# calamares/paru — see docs/CUSTOM_REPO.md). Not a hard requirement:
# without it, keyboard selection still works, just no live preview.
---

xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

# Arch's `kbd` package installs keymaps under /usr/share/kbd/keymaps —
# checked the package's actual file listing rather than assume the
# upstream example's Debian-style /lib/kbd/keymaps path applies here.
convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"

configure:
    kwin: false
    gnome: true
