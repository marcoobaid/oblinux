# Paths verified against archiso's mkarchiso source directly (the squashfs
# lands at <install_dir>/<arch>/airootfs.sfs, the kernel separately at
# <install_dir>/boot/<arch>/vmlinuz-linux — it's not inside the squashfs),
# and cross-checked against /run/archiso/bootmnt being the live boot
# media's actual mountpoint, confirmed in this project's own testing
# (docs/TESTING.md round 3's `df -h` output).
#
# That mountpoint only stays populated if archiso's `copytoram` boot
# feature is off — when it auto-enables (mkinitcpio-archiso hook,
# default `copytoram=auto`: enables when boot media isn't optical, the
# squashfs is under 4GiB, and free RAM exceeds the image size + 2GiB),
# the boot media gets copied into /run/archiso/copytoram/ and
# unmounted, and these paths stop existing entirely — "Bad unpackfs
# configuration" at install time. Round 3's VM testing never hit this
# because VirtualBox mounts an attached ISO as a virtual *optical*
# drive, which alone blocks auto-enable regardless of RAM; a real USB
# stick is a plain block device and doesn't get that exemption (round
# 16, docs/TESTING.md). Fixed at the boot-parameter level instead of
# here — `copytoram=n` is set explicitly on every live-boot kernel
# command line (syslinux/efiboot) so this module's assumption holds
# deterministically, in every boot environment, rather than depending
# on `auto`'s hardware-dependent heuristic.
---

unpack:
    -   source: "/run/archiso/bootmnt/oblinux/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/oblinux/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"
