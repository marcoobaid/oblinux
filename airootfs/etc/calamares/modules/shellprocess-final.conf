# Strips OBLinux's own live-session-only artifacts from the installed
# system. unpackfs clones the live filesystem as-is, so anything live-only
# persists unless explicitly removed here. Went through everything this
# project has actually shipped for the live session (not just copying a
# reference list) — see docs/CALAMARES.md for the full reasoning per item.
#
# pacman-init.service, choose-mirror.service, reflector.service are
# handled separately, via services-systemd.conf's mask/disable (cleaner
# than file removal for units — no dangling enablement symlinks left).
---

dontChroot: false

timeout: 60

script:
    # Live-session passwordless sudo (airootfs/etc/sudoers.d/g_wheel) —
    # must not carry over to a real install.
    - "-rm @@ROOT@@/etc/sudoers.d/g_wheel"

    # GDM's live-session autologin as liveuser (airootfs/etc/gdm/custom.conf)
    # — disable rather than delete the file, so GDM's own [security]/
    # [xdmcp]/[chooser]/[debug] section scaffolding stays intact for any
    # future admin configuration.
    - "sed -i 's/^AutomaticLoginEnable=True/AutomaticLoginEnable=False/' @@ROOT@@/etc/gdm/custom.conf"
    - "-sed -i '/^AutomaticLogin=liveuser/d' @@ROOT@@/etc/gdm/custom.conf"

    # Live-session root rescue-console mechanism (runs a script named by a
    # `script=` kernel cmdline param, on tty1 login) — irrelevant and
    # vestigial on an installed system.
    - "-rm @@ROOT@@/root/.automated_script.sh"
    - "-rm @@ROOT@@/root/.zlogin"

    # tmpfs mount for pacman's gnupg keyring — fine on the live ISO
    # (memory-conservation trick for an ephemeral session), but on an
    # installed system this would make the keyring non-persistent,
    # breaking package signature verification after every reboot.
    - "-rm @@ROOT@@/etc/systemd/system/etc-pacman.d-gnupg.mount"

    # Passwordless root autologin on tty1 (inherited from upstream
    # releng) — must not persist to an installed system.
    - "-rm -r @@ROOT@@/etc/systemd/system/getty@tty1.service.d"

    # Live-session MOTD (wifi/install instructions) doesn't apply once
    # installed.
    - "-rm @@ROOT@@/etc/motd"
