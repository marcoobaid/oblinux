# OBLinux only ships GDM, so only configure that (rather than the generic
# multi-DM search list Calamares defaults to).
---

displaymanagers:
  - gdm

# GDM's own package already sets up its user/var directory correctly
# (confirmed when the GDM PKGBUILD was checked during branding work) —
# best left to it, not re-done here.
basicSetup: false

sysconfigSetup: false
