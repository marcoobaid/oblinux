# No btrfsSubvolumes section — OBLinux uses ext4, not btrfs, for this phase.
#
# `options` on each extraMounts entry must be a YAML list, even for a
# single option — Calamares' mount module joins it with
# ",".join(partition["options"]). A bare string here still passes schema
# validation but gets iterated character-by-character in Python, turning
# "bind" into the mount options "b,i,n,d" instead — caught in round 9 of
# install testing (docs/TESTING.md) when it silently broke the /dev and
# /run/udev bind mounts, which surfaced downstream as mkinitcpio's
# "/dev must be mounted!" rather than as a mount error.
#
# There is no "extraMountsEfi" key — an earlier version of this file
# invented one, and it was silently inert on every platform since round
# 8 (valid YAML, never read by anything). Pulled src/modules/mount/
# main.py fully verbatim to confirm: the module only ever reads a single
# "extraMounts" list, and conditionally prunes individual entries marked
# `efi: true` when `firmwareType` isn't "efi". EFI-only mounts belong
# *inside* extraMounts, tagged that way — not in a separate key. Caught
# only on the first real UEFI install attempt (round 17,
# docs/TESTING.md): grub-install failed with "EFI variables are not
# supported on this system" because /sys/firmware/efi/efivars was never
# bind-mounted into the target chroot at all.
---

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
