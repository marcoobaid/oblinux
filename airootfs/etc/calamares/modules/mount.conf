# No btrfsSubvolumes section — OBLinux uses ext4, not btrfs, for this phase.
#
# `options` on each extraMounts/extraMountsEfi entry must be a YAML list,
# even for a single option — Calamares' mount module joins it with
# ",".join(partition["options"]). A bare string here still passes schema
# validation but gets iterated character-by-character in Python, turning
# "bind" into the mount options "b,i,n,d" instead — caught in round 9 of
# install testing (docs/TESTING.md) when it silently broke the /dev and
# /run/udev bind mounts, which surfaced downstream as mkinitcpio's
# "/dev must be mounted!" rather than as a mount error.
---

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
