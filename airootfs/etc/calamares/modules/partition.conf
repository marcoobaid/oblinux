# OBLinux partitioning: kept deliberately simple for this phase — no
# manual partitioning, no LVM, ext4 only (no filesystem-choice UI at all,
# per Calamares' own docs: omitting availableFileSystemTypes uses
# defaultFileSystemType with no dropdown shown).
---

efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

# Hides the "Manual partitioning" button only — Erase/Replace/Alongside
# (the automated modes) remain available. Calamares doesn't support
# hiding those individually.
allowManualPartitioning: false

# Forces an explicit choice on the partitioning page rather than a
# pre-selected option someone could click past — "erase" in particular
# is destructive, so it should never be the default selection.
initialPartitioningChoice: none

initialSwapChoice: none

defaultFileSystemType:  "ext4"

essentialMounts: [ "live-*", "control" ]

lvm:
    enable: false
