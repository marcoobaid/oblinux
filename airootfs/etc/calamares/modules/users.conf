---

defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - storage
    - optical
    - network
    - power
    - rfkill
    - lp
    - scanner

# No autologin on the installed system — the live session autologins as
# liveuser for convenience only; a real install should always require a
# login, matching standard practice.
autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
sudoersConfigureWithGroup: true

setRootPassword: true
doReusePassword: true

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

userShell: /usr/bin/zsh

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${product}"
  forbidden_names: [ localhost ]

setHostname: EtcFile
writeHostsFile: true

presets:
    fullName:
        editable: true
    loginName:
        editable: true
