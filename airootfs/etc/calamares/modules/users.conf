---

defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - storage
    - optical
    - network
    - power
    - rfkill
    - lp
    - scanner

# No autologin on the installed system — the live session autologins as
# liveuser for convenience only; a real install should always require a
# login, matching standard practice.
autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
sudoersConfigureWithGroup: true

setRootPassword: true
doReusePassword: true

# `nonempty` is not a real key here — Calamares logs "WARNING: nonempty
# check is ignored; use minLength: 1" (visible in every session.log this
# project has produced so far) and silently ignores it. minLength: -1
# meant no password length requirement was actually enforced at all.
passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

# The real key is nested `user.shell`, not a flat `userShell` — verified
# against Calamares' own Config.cpp. The flat key was silently ignored
# (no error, no warning), so every install so far got useradd's own
# default (/bin/bash) instead. Caught only by checking the actual
# `useradd` invocation in session.log against what was configured here.
user:
  shell: /usr/bin/zsh

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${product}"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
